name: Deploy AI Service to EC2
on:
  push:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build -x test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'

    steps:
      - name: Send Discord Notification - Deploy Start
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "🚀 AI 서비스 배포 시작"
          description: |
            **AI 추천 서비스 배포가 시작되었습니다**
            • 커밋: `${{ github.event.head_commit.message }}`
            • 브랜치: `${{ github.ref_name }}`
            • 작성자: ${{ github.event.head_commit.author.name }}
          color: 0xffaa00

      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build application
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mechuragi-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AI Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AI_SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create Docker network if it doesn't exist
            echo "Ensuring Docker network exists..."
            sudo docker network inspect mechuragi-network >/dev/null 2>&1 || \
              sudo docker network create mechuragi-network

            # Pull latest image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mechuragi-ai-service:latest

            # Stop and remove all containers using port 8082
            echo "Checking for containers using port 8082..."
            CONTAINER_IDS=$(sudo docker ps -q --filter "publish=8082")
            if [ -n "$CONTAINER_IDS" ]; then
              echo "Stopping containers using port 8082: $CONTAINER_IDS"
              sudo docker stop $CONTAINER_IDS
              sudo docker rm $CONTAINER_IDS
            else
              echo "No containers using port 8082 found"
            fi

            # Also clean up by name (legacy support)
            sudo docker stop mechuragi-ai-service 2>/dev/null || true
            sudo docker rm mechuragi-ai-service 2>/dev/null || true

            # Run new container with environment variables
            sudo docker run -d \
              -p 8082:8082 \
              --name mechuragi-ai-service \
              --restart unless-stopped \
              -e "SPRING_PROFILES_ACTIVE=dev" \
              -e "DB_HOST=${{ secrets.DB_HOST }}" \
              -e "DB_PORT=3306" \
              -e "DB_NAME=mechuragi_db" \
              -e "DB_USERNAME=mechuragi_user" \
              -e "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              -e "REDIS_HOST=${{ secrets.REDIS_HOST }}" \
              -e "REDIS_PORT=6379" \
              -e "AWS_REGION=ap-northeast-2" \
              -e "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e "BEDROCK_CHAT_MODEL=anthropic.claude-3-haiku-20240307-v1:0" \
              -e "BEDROCK_SMART_MODEL=anthropic.claude-3-haiku-20240307-v1:0" \
              -e "BEDROCK_EMBEDDING_MODEL=amazon.titan-embed-text-v1" \
              -e "MAIN_SERVICE_URL=${{ secrets.MAIN_SERVICE_URL }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/mechuragi-ai-service:latest

            # Wait for application to start
            sleep 45

            # Health check (up to 5 attempts)
            for i in {1..5}; do
              if curl -f http://localhost:8082/api/ai/health; then
                echo "Health check passed"
                break
              else
                echo "Health check failed ($i/5), retrying in 10 seconds..."
                sleep 10
                if [ $i -eq 5 ]; then
                  echo "Health check final failure, showing logs:"
                  sudo docker logs mechuragi-ai-service
                  exit 1
                fi
              fi
            done

            # Clean up old images
            sudo docker image prune -f

      - name: Send Discord Notification - Deploy Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "Success"
          title: "✅ AI 서비스 배포 성공"
          description: |
            **AI 추천 서비스가 성공적으로 배포되었습니다**
            • 서버: AI Service Server:8082
            • 배포 방식: Docker 컨테이너 배포
            • 커밋: `${{ github.event.head_commit.message }}`
            • 작성자: ${{ github.event.head_commit.author.name }}
            • 브랜치: `${{ github.ref_name }}`
          color: 0x00ff00

      - name: Send Discord Notification - Deploy Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "Failure"
          title: "❌ AI 서비스 배포 실패"
          description: |
            **AI 추천 서비스 배포가 실패했습니다**
            • 오류 단계: ${{ job.status }}
            • 커밋: `${{ github.event.head_commit.message }}`
            • 작성자: ${{ github.event.head_commit.author.name }}
            • 브랜치: `${{ github.ref_name }}`
            • 로그 확인: [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000