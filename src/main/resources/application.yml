server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: mechuragi-ai-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 기본값( dev 환경일 경우 : 10 ~ 67 )

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true

# AWS Bedrock Configuration
aws:
  region: ${AWS_REGION:ap-northeast-2}
  bedrock:
    chat-model: ${BEDROCK_CHAT_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
    smart-model: ${BEDROCK_SMART_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
    embedding-model: ${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v1}

# Main Service Configuration for inter-service communication
main-service:
  url: ${MAIN_SERVICE_URL:http://localhost:8080}

# Logging Configuration
logging:
  level:
    com.mechuragi.ai: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

--- # 프로덕션 환경일 경우 ( 70 ~ 80 )
spring:
  config:
    activate:
      on-profile: production

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mechuragi.ai: INFO
    org.springframework.web: WARN