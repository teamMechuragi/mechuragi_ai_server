server:
  port: 8082

spring:
  application:
    name: mechuragi-ai-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 기본값( dev 환경일 경우 : 10 ~ 67 )

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mechuragi_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:mechuragi_user}
    password: ${DB_PASSWORD:mechuragi_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # db 수정안하고 검증만
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# AWS Bedrock Configuration
aws:
  region: ${AWS_REGION:ap-northeast-2}
  bedrock:
    chat-model: ${BEDROCK_CHAT_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
    smart-model: ${BEDROCK_SMART_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
    embedding-model: ${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v1}

# 메인 서버
main-service:
  url: ${MAIN_SERVICE_URL:http://localhost:8080}

# 로깅
logging:
  level:
    com.mechuragi.ai: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

--- # 프로덕션 환경일 경우
spring:
  config:
    activate:
      on-profile: production

# 프로덕션에서 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.mechuragi.ai: INFO
    org.springframework.web: WARN
  file:
    name: ${LOGGING_FILE:/var/log/ai-service/application.log}