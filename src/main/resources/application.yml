server:
  port: 8082

spring:
  application:
    name: mechuragi-ai-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

# AWS Bedrock Configuration
aws:
  region: ${AWS_REGION:ap-northeast-2}
  bedrock:
    chat-model: ${BEDROCK_CHAT_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
    smart-model: ${BEDROCK_SMART_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
    embedding-model: ${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v1}

# Main Service Configuration for inter-service communication
main-service:
  url: ${MAIN_SERVICE_URL:http://localhost:8080}

# Logging Configuration
logging:
  level:
    com.mechuragi.ai: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    com.mechuragi.ai: INFO
    org.springframework.web: WARN
  file:
    name: ${LOGGING_FILE:/var/log/ai-service/application.log}